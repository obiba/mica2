# default advanced settings
spring:
    main.allow-bean-definition-overriding: true
    mail:
        host: localhost
        port: 25
        user:
        password:
        protocol: smtp
        tls: false
        auth: false
    messageSource:
        cacheSeconds: 1
    freemarker:
      template-loader-path: classpath:/web/,classpath:/static/templates/,classpath:/public/templates/,classpath:/templates/,classpath:/_templates/
      request-context-attribute: rc
      settings:
        template_exception_handler: ignore
      charset: UTF-8
      suffix: .ftl
      content-type: text/html;charset=UTF-8
    task:
        scheduling:
            pool:
                size: 30
            thread-name-prefix: mica-executor-
    cache:
      jcache:
        config: classpath:ehcache.xml

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/css,text/javascript,application/javascript,application/x-javascript
    min-response-size: 1024

metrics:
    jmx.enabled: true
    graphite:
        enabled: false
        host: localhost
        port: 2003

cache:
    timeToLiveSeconds: 3600

portal:
  draftResource:
    urlPattern: "{portalUrl}/mica/{resourceType}/{resourceId}/draft/{shareKey}"
  files:
    extensions: .xls,.xlsx,.ods,.doc,.docx,.odt,.ppt,.pptx,.odp,.xml,.yaml,.yml,.jpg,.jpeg,.png,.pdf,.txt,.csv,.tsv,.sav,.sas7bdat,.sas7bcat,.por,.gz,.bz2,.xz,.zip

#
# Plugins
#

plugins:
  micaSearchPlugin: mica-search-es8
  updateSite: https://plugins.obiba.org

#
# Default locale to be used by the Mica portal
#
locale:
    default: en
#
# Security
#

login:
  maxTry: 3
  trialTime: 300
  banTime: 300

csrf:
  allowed-agents: curl,python,java,HTTP.jl

# Per client IP rate limiting of the anonymous endpoints (contact form, sign up, password reset), counted in memory
# on each node. Over the limit, the request is rejected with a 429 status before any Agate or reCAPTCHA call.
# The forwarding headers (X-Forwarded-For, Forwarded) are only read from the trusted proxies (IP addresses or CIDR
# blocks, comma separated): add the address of the reverse proxy when it is not on the same host.
security:
  trustedProxies: 127.0.0.1,::1
  rateLimit:
    enabled: true
    contact:
      maxRequests: 5
      periodSeconds: 600
    signup:
      maxRequests: 10
      periodSeconds: 3600
    forgotPassword:
      maxRequests: 5
      periodSeconds: 600

# Assign roles when user belongs to one or more groups listed. Syntax: "," means all the groups are
# required, "|" separates alternatives. The same groups are used when notifying the users having a role
# (only the groups appearing alone in a condition are notified: with "a,b|c", the members of "c" are notified).
# This makes it possible to share one Agate between several Mica instances, each with its own groups,
# for instance: mica-reviewer: mica-reviewer-a
roles:
  mica-administrator: mica-administrator
  mica-reviewer: mica-reviewer
  mica-editor: mica-editor
  mica-external-editor: mica-external-editor
  mica-data-access-officer: mica-data-access-officer
  mica-user: mica-user
